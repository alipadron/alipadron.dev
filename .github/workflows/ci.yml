name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for PDF generation
        # No --with-deps: it runs apt, and the runner's Ubuntu mirror keeps timing
        # out on DNS (ten minutes per job). ubuntu-latest already carries the
        # libraries Chromium needs; the browser itself comes from the cache above.
        run: npx playwright install chromium

      - run: npm run typecheck

      - run: npm run build

      - run: npm test
