name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for PDF generation
        # --with-deps needs apt; when the runner's mirror is unreachable we still
        # want the browser, and ubuntu-latest already carries most of its libraries.
        run: npx playwright install --with-deps chromium || npx playwright install chromium

      - run: npm run typecheck

      - run: npm run build

      - run: npm test
