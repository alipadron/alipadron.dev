name: Deploy

# Publishes the prerendered site to the Cloudflare Pages project `alipadron-dev`
# on every push to `main`. DNS and custom domains are out of scope.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Chromium for CV generation
        # --with-deps needs apt; when the runner's mirror is unreachable we still
        # want the browser, and ubuntu-latest already carries most of its libraries.
        run: npx playwright install --with-deps chromium || npx playwright install chromium

      - run: npm run build

      - name: Build CV documents and publish the downloadable PDFs
        run: npm run documents

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/analog/public --project-name=alipadron-dev --branch=main
          wranglerVersion: "4.160.0"
